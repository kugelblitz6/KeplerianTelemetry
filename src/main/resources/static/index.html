<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keplerian Telemetry</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0e1a;
      color: #c8d8f0;
      font-family: "Courier New", monospace;
      font-size: 13px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      border-bottom: 1px solid #1e3050;
      background: #0d1220;
    }

    header h1 {
      font-size: 16px;
      font-weight: normal;
      letter-spacing: 0.12em;
      color: #7eb8f7;
      text-transform: uppercase;
    }

    #status {
      margin-left: auto;
      font-size: 11px;
      color: #4a6a90;
    }

    #status.ok::before  { content: "● "; color: #3ddc84; }
    #status.err::before { content: "● "; color: #e05555; }

    main { padding: 20px 24px; }

    #summary {
      display: flex;
      gap: 24px;
      margin-bottom: 20px;
    }

    .stat {
      background: #0d1220;
      border: 1px solid #1e3050;
      border-radius: 4px;
      padding: 10px 18px;
      min-width: 120px;
    }

    .stat-label {
      font-size: 10px;
      color: #4a6a90;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 22px;
      color: #7eb8f7;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      text-align: left;
      padding: 8px 12px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #4a6a90;
      border-bottom: 1px solid #1e3050;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid #111825;
      transition: background 0.15s;
    }

    tbody tr:hover { background: #111d2e; }

    tbody td {
      padding: 8px 12px;
      white-space: nowrap;
    }

    .type-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 3px;
      font-size: 11px;
      background: #1a2a44;
      color: #7eb8f7;
      border: 1px solid #2a4060;
    }

    .num { color: #9fd9b4; font-variant-numeric: tabular-nums; }
    .dim { color: #4a6a90; }

    #empty {
      text-align: center;
      padding: 60px 0;
      color: #2a4060;
    }

    #updated-at {
      font-size: 11px;
      color: #2a4060;
      margin-top: 16px;
      text-align: right;
    }

    #filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    #filter-bar label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #4a6a90;
    }

    #type-filter {
      background: #0d1220;
      color: #c8d8f0;
      border: 1px solid #2a4060;
      border-radius: 3px;
      padding: 4px 10px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    #type-filter:focus { outline: 1px solid #7eb8f7; }
  </style>
</head>
<body>
  <header>
    <h1>Keplerian Telemetry</h1>
    <div id="status">Connecting…</div>
  </header>

  <main>
    <div id="summary">
      <div class="stat">
        <div class="stat-label">Objects</div>
        <div class="stat-value" id="count">—</div>
      </div>
    </div>

    <div id="filter-bar">
      <label for="type-filter">Type</label>
      <select id="type-filter"><option value="">All</option></select>
    </div>

    <table id="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Type</th>
          <th>Parent ID</th>
          <th>Pos X</th>
          <th>Pos Y</th>
          <th>Pos Z</th>
          <th>Vel X</th>
          <th>Vel Y</th>
          <th>Vel Z</th>
          <th>Epoch</th>
          <th>SMA (m)</th>
          <th>Ecc</th>
          <th>Inc (°)</th>
          <th>RAAN (°)</th>
          <th>ArgP (°)</th>
          <th>MA (°)</th>
          <th>Updated</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <div id="empty" style="display:none">No telemetry data received yet.</div>
    <div id="updated-at"></div>
  </main>

  <script>
    const POLL_MS = 10000;

    const statusEl     = document.getElementById("status");
    const countEl      = document.getElementById("count");
    const tbodyEl      = document.getElementById("tbody");
    const emptyEl      = document.getElementById("empty");
    const tableEl      = document.getElementById("table");
    const updatedEl    = document.getElementById("updated-at");
    const typeFilterEl = document.getElementById("type-filter");

    let allObjects = [];

    function fmt(n) {
      if (n == null) return '<span class="dim">—</span>';
      return `<span class="num">${Number(n).toFixed(3)}</span>`;
    }

    function fmtDeg(n) {
      if (n == null) return '<span class="dim">—</span>';
      return `<span class="num">${Number(n).toFixed(4)}</span>`;
    }

    function fmtEcc(n) {
      if (n == null) return '<span class="dim">—</span>';
      return `<span class="num">${Number(n).toFixed(7)}</span>`;
    }

    function fmtEpoch(ep) {
      if (ep == null) return '<span class="dim">—</span>';
      return `<span class="num">${new Date(ep * 1000).toISOString().replace("T", " ").slice(0, 19)}</span>`;
    }

    function timeAgo(iso) {
      if (!iso) return '<span class="dim">—</span>';
      const sec = Math.round((Date.now() - new Date(iso)) / 1000);
      if (sec < 2)  return '<span class="num">now</span>';
      if (sec < 60) return `<span class="num">${sec}s ago</span>`;
      return `<span class="num">${Math.floor(sec/60)}m ago</span>`;
    }

    function updateTypeOptions(objects) {
      const current = typeFilterEl.value;
      const types = [...new Set(objects.map(o => o.type).filter(Boolean))].sort();
      typeFilterEl.innerHTML = '<option value="">All</option>' +
        types.map(t => `<option value="${t}"${t === current ? " selected" : ""}>${t}</option>`).join("");
    }

    function applyFilter() {
      const selected = typeFilterEl.value;
      const filtered = selected ? allObjects.filter(o => o.type === selected) : allObjects;
      renderTable(filtered);
    }

    function renderTable(objects) {
      countEl.textContent = objects.length;

      if (objects.length === 0) {
        tableEl.style.display = "none";
        emptyEl.style.display = "block";
        return;
      }

      tableEl.style.display = "table";
      emptyEl.style.display = "none";

      tbodyEl.innerHTML = objects.map(o => `
        <tr>
          <td>${o.id ?? ""}</td>
          <td>${o.name ?? '<span class="dim">—</span>'}</td>
          <td>${o.type ?? '<span class="dim">—</span>'}</td>
          <td>${o.parentId ?? '<span class="dim">—</span>'}</td>
          <td>${fmt(o.cart?.position?.x)}</td>
          <td>${fmt(o.cart?.position?.y)}</td>
          <td>${fmt(o.cart?.position?.z)}</td>
          <td>${fmt(o.cart?.velocity?.x)}</td>
          <td>${fmt(o.cart?.velocity?.y)}</td>
          <td>${fmt(o.cart?.velocity?.z)}</td>
          <td>${fmtEpoch(o.kep?.ep)}</td>
          <td>${fmt(o.kep?.a)}</td>
          <td>${fmtEcc(o.kep?.e)}</td>
          <td>${fmtDeg(o.kep?.i)}</td>
          <td>${fmtDeg(o.kep?.raan)}</td>
          <td>${fmtDeg(o.kep?.argp)}</td>
          <td>${fmtDeg(o.kep?.ma)}</td>
          <td>${timeAgo(o.updatedAt)}</td>
        </tr>
      `).join("");
    }

    function render(objects) {
      objects.sort((a, b) => a.id - b.id);
      allObjects = objects;
      updateTypeOptions(objects);
      applyFilter();
      updatedEl.textContent = "Last fetch: " + new Date().toLocaleTimeString();
    }

    typeFilterEl.addEventListener("change", applyFilter);

    async function poll() {
      try {
        const res = await fetch("/api/objects");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        statusEl.className = "ok";
        statusEl.textContent = "Live";
        render(data);
      } catch (e) {
        statusEl.className = "err";
        statusEl.textContent = e.message;
      }
    }

    poll();
    setInterval(poll, POLL_MS);
  </script>
</body>
</html>
